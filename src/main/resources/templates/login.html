<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/layout :: cabecera('Iniciar sesión')}"></head>
<body>
<main class="login">
    <p class="login-marca">AlquilaYa</p>

    <section class="caja">
        <div class="caja-titulo"><h1>Iniciar sesión</h1></div>
        <div class="caja-cuerpo">
            <div class="aviso aviso-error" th:if="${param.error}">Correo o contraseña incorrectos.</div>
            <div class="aviso aviso-ok" th:if="${param.logout}">Cerraste sesión correctamente.</div>

            <form th:action="@{/login}" method="post">
                <div class="campo">
                    <label for="username">Correo</label>
                    <input id="username" name="username" type="email" required autofocus autocomplete="username">
                </div>
                <div class="campo">
                    <label for="password">Contraseña</label>
                    <input id="password" name="password" type="password" required autocomplete="current-password">
                </div>
                <button type="submit" class="boton boton-verde">Entrar</button>
            </form>
        </div>
    </section>
</main>
</body>
</html>
