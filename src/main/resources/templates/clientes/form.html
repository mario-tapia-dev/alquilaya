<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/layout :: cabecera('Cliente')}"></head>
<body>
<header th:replace="~{fragments/layout :: menu('clientes')}"></header>

<main class="contenedor">
    <section class="caja">
        <div class="caja-titulo"><h1 th:text="${titulo}">Cliente</h1></div>
        <div class="caja-cuerpo">
            <form class="formulario" th:action="@{${accion}}" th:object="${cliente}" method="post">
                <div class="errores" th:if="${#fields.hasErrors('*')}">
                    <strong>Revisa estos datos:</strong>
                    <ul><li th:each="e : ${#fields.detailedErrors()}" th:text="${e.message}">Error</li></ul>
                </div>
                <div class="aviso aviso-error" th:if="${error}" th:text="${error}">Error</div>

                <div class="campo">
                    <label for="nombre">Nombre</label>
                    <input id="nombre" type="text" th:field="*{nombre}" th:errorclass="campo-error" maxlength="50">
                </div>
                <div class="campo">
                    <label for="apellido">Apellido</label>
                    <input id="apellido" type="text" th:field="*{apellido}" th:errorclass="campo-error" maxlength="50">
                </div>
                <div class="campo">
                    <label for="email">Correo</label>
                    <input id="email" type="email" th:field="*{email}" th:errorclass="campo-error" maxlength="100">
                </div>
                <div class="campo">
                    <label for="licenciaConducir">Licencia de conducir</label>
                    <input id="licenciaConducir" type="text" th:field="*{licenciaConducir}" th:errorclass="campo-error" maxlength="50">
                </div>
                <div class="campo">
                    <label for="telefono">Teléfono</label>
                    <input id="telefono" type="text" th:field="*{telefono}" th:errorclass="campo-error" maxlength="20">
                </div>

                <div class="acciones">
                    <button type="submit" class="boton boton-verde">Guardar cliente</button>
                    <a class="boton boton-claro" th:href="@{/clientes}">Cancelar</a>
                </div>
            </form>
        </div>
    </section>
</main>
</body>
</html>
