<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/layout :: cabecera('Vehículo')}"></head>
<body>
<header th:replace="~{fragments/layout :: menu('vehiculos')}"></header>

<main class="contenedor">
    <section class="caja">
        <div class="caja-titulo"><h1 th:text="${titulo}">Vehículo</h1></div>
        <div class="caja-cuerpo">
            <p class="vacio" th:if="${oficinas.isEmpty()}">Antes de registrar un vehículo necesitas al menos una oficina.
                <a th:href="@{/oficinas/nueva}">Crear oficina</a></p>

            <form class="formulario" th:action="@{${accion}}" th:object="${vehiculo}" method="post" th:unless="${oficinas.isEmpty()}">
                <div class="errores" th:if="${#fields.hasErrors('*')}">
                    <strong>Revisa estos datos:</strong>
                    <ul><li th:each="e : ${#fields.detailedErrors()}" th:text="${e.message}">Error</li></ul>
                </div>
                <div class="aviso aviso-error" th:if="${error}" th:text="${error}">Error</div>

                <div class="campo">
                    <label for="marca">Marca</label>
                    <input id="marca" type="text" th:field="*{marca}" th:errorclass="campo-error" maxlength="50">
                </div>
                <div class="campo">
                    <label for="modelo">Modelo</label>
                    <input id="modelo" type="text" th:field="*{modelo}" th:errorclass="campo-error" maxlength="50">
                </div>
                <div class="campo">
                    <label for="anio">Año</label>
                    <input id="anio" type="number" th:field="*{anio}" th:errorclass="campo-error" min="1900" max="2100">
                </div>
                <div class="campo">
                    <label for="matricula">Matrícula</label>
                    <input id="matricula" type="text" th:field="*{matricula}" th:errorclass="campo-error" maxlength="20">
                </div>
                <div class="campo">
                    <label for="tarifaDiaria">Tarifa diaria ($)</label>
                    <input id="tarifaDiaria" type="number" step="0.01" min="0.01" th:field="*{tarifaDiaria}" th:errorclass="campo-error">
                </div>
                <div class="campo">
                    <label for="oficina">Oficina</label>
                    <select id="oficina" th:field="*{oficina.idOficina}">
                        <option value="">Selecciona una oficina</option>
                        <option th:each="o : ${oficinas}" th:value="${o.idOficina}"
                                th:text="${o.nombreOficina} + ' (' + ${o.ciudad} + ')'">Oficina</option>
                    </select>
                </div>
                <div class="campo campo-ancho">
                    <label for="estado">Estado</label>
                    <select id="estado" th:field="*{estado}">
                        <option value="DISPONIBLE">Disponible</option>
                        <option value="MANTENIMIENTO">En mantenimiento</option>
                        <option value="ALQUILADO" th:if="${vehiculo.estado == 'ALQUILADO'}">Alquilado (automático)</option>
                    </select>
                    <small>«Alquilado» se asigna solo mientras el vehículo tiene un alquiler en curso.</small>
                </div>

                <div class="acciones">
                    <button type="submit" class="boton boton-verde">Guardar vehículo</button>
                    <a class="boton boton-claro" th:href="@{/vehiculos}">Cancelar</a>
                </div>
            </form>
        </div>
    </section>
</main>
</body>
</html>
