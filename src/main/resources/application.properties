spring.application.name=alquilaya

spring.config.import=optional:file:.env[.properties]

server.port = 1501
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/alquilaya?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto = update
spring.jpa.show-sql = true

app.admin.email = admin@alquilaya.com
app.admin.password = Admin1234

app.operador.email = operador@alquilaya.com
app.operador.password = Operador123
